name: Edge CI

# Relais laststream-edge (services/edge).

on:
  push:
    branches: [main]
    paths: ['services/edge/**', '.github/workflows/edge-ci.yml']
  pull_request:
    branches: [main]
    paths: ['services/edge/**', '.github/workflows/edge-ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: services/edge

# PR : un nouveau push annule le run en cours. main : le run en cours va au bout, seul le plus récent en attente est conservé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Tests et compilation Wrangler à blanc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Node 22, comme la CI de lastaddon (le code de production tourne sur workerd).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      # Compilation à blanc : --dry-run ne téléverse rien vers Cloudflare (aucun déploiement dans ce workflow).
      # Version épinglée comme celle de lastaddon (package-lock.json) ; pas de secret nécessaire.
      - run: npx --yes wrangler@4.151.1 deploy --dry-run --outdir dist-dryrun
        env:
          WRANGLER_SEND_METRICS: "false"
