name: Core CI

# Serveur lastaddon-core (services/core). Se declenche aussi quand le protocole partage (packages/protocol) change.

on:
  push:
    branches: [main]
    paths: ['services/core/**', 'packages/protocol/**', '.github/workflows/core-ci.yml', '!services/core/docs/**', '!**/*.md']
  pull_request:
    branches: [main]
    paths: ['services/core/**', 'packages/protocol/**', '.github/workflows/core-ci.yml', '!services/core/docs/**', '!**/*.md']

permissions:
  contents: read

defaults:
  run:
    working-directory: services/core

# PR : un nouveau push annule le run en cours. main : le run en cours va au bout, seul le plus récent en attente est conservé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners hébergés par GitHub (ubuntu-latest) : machine neuve à chaque job, cache npm de setup-node.
# PR : seuls les tests des fichiers modifiés depuis origin/main (--changed). Push sur main : suites complètes.
jobs:
  test:
    name: Typecheck, lint, knip, tests Node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/core/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run knip

      - name: Tests des fichiers modifiés (PR)
        if: github.event_name == 'pull_request'
        run: npm test -- --changed origin/main --passWithNoTests

      - name: Suite complète (push sur main)
        if: github.event_name != 'pull_request'
        run: npm test

  workers:
    name: Tests Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/core/package-lock.json

      - run: npm ci

      - name: Tests Workers des fichiers modifiés (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:workers -- --changed origin/main --passWithNoTests

      - name: Suite Workers complète (push sur main)
        if: github.event_name != 'pull_request'
        run: npm run test:workers
