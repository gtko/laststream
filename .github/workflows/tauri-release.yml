name: Tauri release

# Coque Tauri (apps/tauri) : construit, pour un tag vX.Y.Z déjà poussé, les fichiers d'une release et leurs flux signés.
# Appelé par release.yml (releases automatiques) ; n'expose que des artefacts, release.yml publie.
#  - macos-aarch64 et macos-x86_64 : Laststream-X.Y.Z-<plateforme>.dmg (installation) et .app.tar.gz (mise à jour), app
#    signée Developer ID et notarisée si les secrets Apple sont fournis, sinon signée ad hoc ;
#  - windows-x86_64 : Laststream-X.Y.Z-windows-x86_64.setup.exe (NSIS, installation et mise à jour), non signé ; le même
#    installeur sous le nom Laststream-Setup-X.Y.Z.exe avec latest.json (+ .sig) : flux de l'ancienne coque Windows
#    (apps/desktop), qui passe ainsi à l'app Tauri ;
#  - linux-x86_64 : Laststream-X.Y.Z-linux-x86_64.AppImage (installation et mise à jour) et .deb ;
#  - pour chaque plateforme : tauri-<plateforme>-latest.json et sa signature ed25519 (.sig), même clé que la coque Windows.
# Le Worker laststream-edge sert flux et fichiers sous https://app.laststream.app/app/tauri/<plateforme>/.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag déjà poussé, format vX.Y.Z'
        required: true
        type: string
    secrets:
      LASTSTREAM_UPDATE_SIGNING_KEY:
        required: true
      # Signature Developer ID et notarisation macOS : facultatives, toutes ensemble (voir le job macos).
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: true
      matrix:
        include:
        - { runner: macos-15, platform: macos-aarch64 }
        - { runner: macos-15-intel, platform: macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      PLATFORM: ${{ matrix.platform }}
    steps:
    - name: Check the tag
      run: |
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag inattendu : $TAG"; exit 1; }
        echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: refs/tags/${{ inputs.tag }}
        fetch-depth: 1
        persist-credentials: false
    - name: Version of the app matches the tag
      run: grep -q "^version = \"$VERSION\"$" apps/tauri/src-tauri/Cargo.toml || { echo "::error::apps/tauri/src-tauri/Cargo.toml n'est pas en $VERSION"; exit 1; }
    # Cache restauré avant la préparation de libmpv : la restauration remplace target/.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/tauri/src-tauri
    - name: mpv (Homebrew) staged for the bundle
      run: |
        brew install mpv dylibbundler pkg-config
        bash apps/tauri/scripts/stage-mpv-macos.sh
    # Signature Developer ID et notarisation : seulement si les 5 secrets Apple sont présents (voir apps/tauri/README.md,
    # « Signature et notarisation macOS »). Aucun : app signée ad hoc comme avant (avertissement). Une partie seulement :
    # erreur, pour ne jamais publier par mégarde une app à moitié configurée.
    - name: Apple signing certificate
      id: apple
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        set -euo pipefail
        present=0
        for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
          [ -n "${!v}" ] && present=$((present + 1))
        done
        if [ "$present" -eq 0 ]; then
          echo "::warning::Secrets Apple absents : app macOS signée ad hoc, non notarisée."
          echo "signed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$present" -ne 5 ]; then
          echo "::error::Secrets Apple incomplets ($present/5) : APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD et APPLE_TEAM_ID sont tous nécessaires."
          exit 1
        fi
        # Trousseau temporaire, propre à ce job (le runner est jetable).
        keychain="$RUNNER_TEMP/laststream-signing.keychain-db"
        keychain_password="$(uuidgen)"
        printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
        if [ -z "$identity" ]; then
          echo "::error::Aucune identité « Developer ID Application » dans APPLE_CERTIFICATE (un certificat « Apple Development » ou « Mac App Distribution » ne permet pas la notarisation)."
          exit 1
        fi
        echo "Identité de signature : $identity"
        echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
        echo "signed=true" >> "$GITHUB_OUTPUT"
    - name: Build the app
      working-directory: apps/tauri
      env:
        LASTSTREAM_MPV_LIB_DIR: ${{ github.workspace }}/apps/tauri/src-tauri/target/mpv-stage
        SIGNED: ${{ steps.apple.outputs.signed }}
        # Lus par la CLI Tauri : notarisation (notarytool) et agrafage de Laststream.app quand une identité est fournie.
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        set -euo pipefail
        npm ci
        config=src-tauri/target/mpv-stage/frameworks.json
        if [ "$SIGNED" = "true" ]; then
          # Bibliothèques mpv + identité Developer ID, runtime renforcé et droits (une seule configuration fusionnée).
          jq --arg id "$APPLE_SIGNING_IDENTITY" --arg ent "$GITHUB_WORKSPACE/apps/tauri/src-tauri/mac/Entitlements.plist" \
            '.bundle.macOS += {signingIdentity: $id, hardenedRuntime: true, entitlements: $ent}' \
            "$config" > src-tauri/target/mpv-stage/release-config.json
          config=src-tauri/target/mpv-stage/release-config.json
        else
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
        fi
        # hdiutil échoue parfois sur les runners macOS (« create failed - Resource busy ») : nouvel essai, la compilation
        # reste en cache et seul l'empaquetage est refait.
        for attempt in 1 2 3; do
          npx tauri build --bundles app,dmg --config "$config" && break
          [ "$attempt" -lt 3 ] || exit 1
          echo "::warning::Empaquetage macOS échoué (essai $attempt), nouvel essai"
          sleep 15
        done
    # Le .dmg lui-même : notarisé et agrafé à son tour, pour que Gatekeeper l'accepte hors ligne dès l'ouverture.
    - name: Notarize the disk image and check the signatures
      if: ${{ steps.apple.outputs.signed == 'true' }}
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        set -euo pipefail
        bundle=apps/tauri/src-tauri/target/release/bundle
        app="$bundle/macos/Laststream.app"
        dmgs=("$bundle"/dmg/*.dmg)
        [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Un .dmg attendu"; exit 1; }
        codesign --verify --deep --strict --verbose=2 "$app"
        # Le .dmg est signé par Tauri en principe ; sinon il l'est ici (Gatekeeper vérifie sa signature avant de l'ouvrir).
        codesign --verify "${dmgs[0]}" 2>/dev/null || codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp "${dmgs[0]}"
        xcrun stapler validate "$app"
        spctl --assess --type execute --verbose=4 "$app"
        xcrun notarytool submit "${dmgs[0]}" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
        xcrun stapler staple "${dmgs[0]}"
        xcrun stapler validate "${dmgs[0]}"
        spctl --assess --type open --context context:primary-signature --verbose=4 "${dmgs[0]}"
    - name: Name the files, build and sign the feed
      env:
        LASTSTREAM_UPDATE_SIGNING_KEY: ${{ secrets.LASTSTREAM_UPDATE_SIGNING_KEY }}
      run: |
        set -euo pipefail
        bundle=apps/tauri/src-tauri/target/release/bundle
        mkdir -p dist
        dmgs=("$bundle"/dmg/*.dmg)
        [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Un .dmg attendu"; exit 1; }
        cp "${dmgs[0]}" "dist/Laststream-$VERSION-$PLATFORM.dmg"
        tar -czf "dist/Laststream-$VERSION-$PLATFORM.app.tar.gz" -C "$bundle/macos" Laststream.app
        node apps/tauri/scripts/tauri-feed.mjs --platform "$PLATFORM" --version "$VERSION" \
          --file "dist/Laststream-$VERSION-$PLATFORM.app.tar.gz" --out "dist/tauri-$PLATFORM-latest.json"
        node apps/desktop/scripts/sign-update.mjs "dist/tauri-$PLATFORM-latest.json"
        ls -la dist
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tauri-${{ matrix.platform }}
        path: dist/*
        if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      PLATFORM: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
    - name: disable git eol translation
      run: git config --global core.autocrlf false
    - name: Check the tag
      run: |
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag inattendu : $TAG"; exit 1; }
        echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: refs/tags/${{ inputs.tag }}
        fetch-depth: 1
        persist-credentials: false
    - name: Version of the app matches the tag
      run: grep -q "^version = \"$VERSION\"" apps/tauri/src-tauri/Cargo.toml || { echo "::error::apps/tauri/src-tauri/Cargo.toml n'est pas en $VERSION"; exit 1; }
    # Cache restauré avant la préparation de libmpv : la restauration remplace target/.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/tauri/src-tauri
    - name: libmpv (Git LFS)
      env:
        LFS_TOKEN: ${{ github.token }}
      run: |
        auth=$(printf 'x-access-token:%s' "$LFS_TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
          git lfs pull --include="apps/desktop/libmpv-2_x64.zip"
        mkdir -p apps/tauri/src-tauri/target/mpv-win
        unzip -o -j apps/desktop/libmpv-2_x64.zip "*libmpv-2.dll" -d apps/tauri/src-tauri/target/mpv-win
        test -s apps/tauri/src-tauri/target/mpv-win/libmpv-2.dll
    - name: Build the installer
      working-directory: apps/tauri
      run: |
        npm ci
        npx tauri build --bundles nsis --config '{"bundle":{"resources":{"target/mpv-win/libmpv-2.dll":"libmpv-2.dll"}}}'
    - name: Name the installer, build and sign the feed
      env:
        LASTSTREAM_UPDATE_SIGNING_KEY: ${{ secrets.LASTSTREAM_UPDATE_SIGNING_KEY }}
      run: |
        set -euo pipefail
        mkdir -p dist
        installers=(apps/tauri/src-tauri/target/release/bundle/nsis/*.exe)
        [ "${#installers[@]}" -eq 1 ] || { echo "::error::Un installeur NSIS attendu"; exit 1; }
        cp "${installers[0]}" "dist/Laststream-$VERSION-$PLATFORM.setup.exe"
        node apps/tauri/scripts/tauri-feed.mjs --platform "$PLATFORM" --version "$VERSION" \
          --file "dist/Laststream-$VERSION-$PLATFORM.setup.exe" --out "dist/tauri-$PLATFORM-latest.json"
        node apps/desktop/scripts/sign-update.mjs "dist/tauri-$PLATFORM-latest.json"
        # Ancienne coque Windows (apps/desktop, jusqu'à 1.0.59) : elle lit app.laststream.app/app/windows/latest.json, que
        # laststream-edge relit dans latest.json de la dernière release. Sans ce flux, elle restait sur sa version pour
        # toujours. Même installeur NSIS, au nom et au format que l'ancien updater attend, signé avec la même clé.
        cp "${installers[0]}" "dist/Laststream-Setup-$VERSION.exe"
        node apps/desktop/scripts/windows-manifest.mjs build "dist/Laststream-Setup-$VERSION.exe" \
          --notes "Laststream $TAG" --out dist/latest.json
        node apps/desktop/scripts/sign-update.mjs dist/latest.json
        test -s dist/latest.json && test -s dist/latest.json.sig || { echo "::error::Flux de l'ancienne coque Windows absent"; exit 1; }
        ls -la dist
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tauri-windows-x86_64
        path: dist/*
        if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      PLATFORM: linux-x86_64
    steps:
    - name: Check the tag
      run: |
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag inattendu : $TAG"; exit 1; }
        echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: refs/tags/${{ inputs.tag }}
        fetch-depth: 1
        persist-credentials: false
    - name: Version of the app matches the tag
      run: grep -q "^version = \"$VERSION\"$" apps/tauri/src-tauri/Cargo.toml || { echo "::error::apps/tauri/src-tauri/Cargo.toml n'est pas en $VERSION"; exit 1; }
    - name: System libraries (WebKitGTK, mpv)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libmpv-dev pkg-config
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/tauri/src-tauri
    - name: Build the packages
      working-directory: apps/tauri
      env:
        APPIMAGE_EXTRACT_AND_RUN: '1'
      run: |
        npm ci
        npx tauri build --bundles appimage,deb
    - name: Name the files, build and sign the feed
      env:
        LASTSTREAM_UPDATE_SIGNING_KEY: ${{ secrets.LASTSTREAM_UPDATE_SIGNING_KEY }}
      run: |
        set -euo pipefail
        bundle=apps/tauri/src-tauri/target/release/bundle
        mkdir -p dist
        cp "$bundle"/appimage/*.AppImage "dist/Laststream-$VERSION-$PLATFORM.AppImage"
        cp "$bundle"/deb/*.deb "dist/Laststream-$VERSION-$PLATFORM.deb"
        node apps/tauri/scripts/tauri-feed.mjs --platform "$PLATFORM" --version "$VERSION" \
          --file "dist/Laststream-$VERSION-$PLATFORM.AppImage" --out "dist/tauri-$PLATFORM-latest.json"
        node apps/desktop/scripts/sign-update.mjs "dist/tauri-$PLATFORM-latest.json"
        ls -la dist
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tauri-linux-x86_64
        path: dist/*
        if-no-files-found: error

