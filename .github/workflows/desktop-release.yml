name: Desktop release

# Publication d'une version Windows (apps/desktop), lancee a la main (workflow_dispatch, avec un tag deja pousse, ex. desktop-v1.0.25).
# Un push de tag ne la lance pas : elle ne part qu'apres le staging des dependances.
# Les archives de l'interface et du serveur (ui.zip, lastaddon.zip, deps.json) sont preparees en local par
# apps/desktop/scripts/stage-release-deps.ps1 et posees sur la release brouillon du tag. Ce workflow ne lit aucun autre depot,
# n'a aucun jeton inter-depots et ne telecharge que les trois fichiers de la release.
# Produit l'installeur, son SHA-256, le flux latest.json signe (ed25519) et publie la release.
# Appelable aussi en workflow_call depuis release.yml (releases automatiques, tag vX.Y.Z) : deps=artifact prepare ui.zip et
# lastaddon.zip dans le job stage-deps (aucune release brouillon requise) ; publish=false laisse release.yml publier la release,
# ce workflow n'exposant alors que l'artefact desktop-release (installeur, .sha256, latest.json, latest.json.sig).
# Les tags vX.Y.Z et desktop-vX.Y.Z sont acceptes.
# Le televersement R2 reste manuel (upload.ps1) : aucun jeton Cloudflare dans ce workflow.
# Pas d'Authenticode (decision produit) : l'installeur n'est pas signe de code.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag deja pousse a publier, format desktop-vX.Y.Z ou vX.Y.Z (ex. desktop-v1.0.25)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag deja pousse, format vX.Y.Z ou desktop-vX.Y.Z'
        required: true
        type: string
      deps:
        description: "Source des dependances : 'release' (assets de la release brouillon) ou 'artifact' (stage-deps dans ce run)"
        required: false
        type: string
        default: release
      publish:
        description: 'true : publie la release ; false : expose seulement l artefact desktop-release'
        required: false
        type: boolean
        default: true

# Lecture seule par defaut. Les jobs qui ecrivent sont explicites ci-dessous.
permissions:
  contents: read

# Une seule publication par tag a la fois ; une execution en cours n'est jamais annulee.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  fetch-deps:
    # Sauté avec deps=artifact (stage-deps le remplace). En workflow_dispatch, inputs.deps est vide : mode release.
    if: ${{ inputs.deps != 'artifact' }}
    # contents: write : une release brouillon n'est lisible qu'avec un acces en ecriture (non verifie sur ce depot).
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Validate the tag input (vX.Y.Z)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:RELEASE_TAG -notmatch '^(desktop-)?v[0-9]+\.[0-9]+\.[0-9]+\z') { throw "Tag invalide '$env:RELEASE_TAG' : format vX.Y.Z ou desktop-vX.Y.Z attendu (ex. desktop-v1.0.25)." }
    - name: Download the staged dependencies from the release
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force deps | Out-Null
        gh release download $env:RELEASE_TAG --dir deps --pattern ui.zip --pattern lastaddon.zip --pattern deps.json
        foreach ($f in 'ui.zip', 'lastaddon.zip', 'deps.json') {
          if (-not (Test-Path -LiteralPath (Join-Path deps $f))) {
            throw "Archive $f absente de la release $env:RELEASE_TAG : lancer apps/desktop/scripts/stage-release-deps.ps1 -Version <X.Y.Z> d'abord."
          }
        }
    - name: Check the staged files against deps.json
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $deps = Get-Content -LiteralPath deps/deps.json -Raw | ConvertFrom-Json
        # deps.json porte toujours desktop-vX.Y.Z, meme quand le tag publie est vX.Y.Z.
        $expectedTag = if ($env:RELEASE_TAG.StartsWith('desktop-')) { $env:RELEASE_TAG } else { "desktop-$env:RELEASE_TAG" }
        if ($deps.tag -ne $expectedTag) { throw "deps.json vise $($deps.tag), pas $expectedTag : restager avec la bonne version." }
        foreach ($name in 'ui.zip', 'lastaddon.zip') {
          $entry = $deps.files.$name
          $actual = (Get-FileHash -LiteralPath (Join-Path deps $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $entry.sha256) { throw "SHA-256 de $name different de deps.json : archive altérée ou restagée sans deps.json." }
        }
    - name: Upload the staged dependencies
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-deps
        path: deps
        if-no-files-found: error

  stage-deps:
    # deps=artifact : equivalent CI de stage-release-deps.ps1, sans release brouillon ni poste local.
    if: ${{ inputs.deps == 'artifact' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
    - name: Validate the tag input and extract the version
      id: ver
      shell: bash
      run: |
        if ! [[ "$RELEASE_TAG" =~ ^(desktop-)?v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "::error::Tag invalide '$RELEASE_TAG' : format vX.Y.Z ou desktop-vX.Y.Z attendu"
          exit 1
        fi
        echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
    - name: checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: ${{ format('refs/tags/{0}', inputs.tag) }}
        persist-credentials: false
    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build the web app (ui)
      shell: bash
      working-directory: apps/web
      run: |
        npm ci
        npm run build
    - name: Bundle the core (lastaddon)
      shell: bash
      working-directory: services/core
      run: |
        npm ci
        npm run bundle
    # Doit rester aligne sur Node v22 LTS et son SHA-256 (voir l'en-tete de stage-deps-ci.mjs).
    - name: Stage ui.zip, lastaddon.zip and deps.json
      shell: bash
      env:
        VERSION: ${{ steps.ver.outputs.version }}
      run: |
        node apps/desktop/scripts/stage-deps-ci.mjs --version "$VERSION" --web-dist apps/web/dist           --core-bundle services/core/dist-bundle --node-version v22.23.4           --node-sha256 dccc52de28d8df2ee22d2062424f8c563070d95d8ad70c54c4bf01d590dec14f --out deps-staged
    - name: Upload the staged dependencies
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-deps
        path: deps-staged
        if-no-files-found: error

  build:
    needs: [fetch-deps, stage-deps]
    # fetch-deps ou stage-deps est saute selon deps ; l'autre doit avoir reussi.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
    # The Windows runners have autocrlf enabled by default (voir test.yml)
    - name: disable git eol translation
      run: git config --global core.autocrlf false
      # Avant le checkout, apps/desktop n'existe pas encore : racine du workspace.
      working-directory: .
    - name: checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: ${{ format('refs/tags/{0}', inputs.tag) }}
        persist-credentials: false
        # Binaires du bundle (bin/, server.js, archives libmpv) : Git LFS.
        lfs: true
    - name: Check the tag matches the versions (Cargo.toml, Cargo.lock, Laststream.iss)
      shell: bash
      run: |
        node scripts/windows-manifest.mjs check
        cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
        if [ "$RELEASE_TAG" != "desktop-v$cargo_version" ] && [ "$RELEASE_TAG" != "v$cargo_version" ]; then
          echo "::error::Le tag $RELEASE_TAG ne correspond pas a la version $cargo_version de Cargo.toml"
          exit 1
        fi
    - name: Download the staged dependencies
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-deps
        path: apps/desktop/deps
    - name: Stable toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc
        # Construction a neuf de ce qui est signe : pas de cache de toolchain.
        cache: false
    - name: Build x64 release
      run: cargo build --release --locked --target x86_64-pc-windows-msvc
    # pwsh et non bash : Git Bash met /usr/bin/link devant le link.exe MSVC et casse l'edition de liens ARM64.
    - name: Build ARM64 release (binary only, no installer)
      shell: pwsh
      run: |
        rustup target add aarch64-pc-windows-msvc
        cargo build --release --locked --target aarch64-pc-windows-msvc
    # dist\laststream-desktop : fichiers du depot (bin/, server.js, README-FR.txt de setup/, libmpv), archives ui/ et
    # lastaddon/ verifiees, libVLC (vlc/, LAST-504), et le binaire x64 compile ici, qui remplace laststream.exe.
    - name: Assemble dist/laststream-desktop
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $bundle = 'dist/laststream-desktop'
        New-Item -ItemType Directory -Force $bundle | Out-Null
        Copy-Item -Path 'bin/*' -Destination $bundle -Force
        Copy-Item -LiteralPath 'server.js' -Destination $bundle -Force
        Copy-Item -LiteralPath 'setup/README-FR.txt' -Destination $bundle -Force
        Expand-Archive -LiteralPath 'libmpv-2_x64.zip' -DestinationPath 'dist/mpv-x64' -Force
        $mpv = Get-ChildItem -Path 'dist/mpv-x64' -Recurse -Filter 'libmpv-2.dll' | Select-Object -First 1
        if (-not $mpv) { throw 'libmpv-2.dll absent de libmpv-2_x64.zip' }
        Copy-Item -LiteralPath $mpv.FullName -Destination $bundle -Force
        Expand-Archive -LiteralPath 'deps/ui.zip' -DestinationPath $bundle -Force
        Expand-Archive -LiteralPath 'deps/lastaddon.zip' -DestinationPath $bundle -Force
        # libVLC 3.0.21 (moteur secondaire) : telecharge, verifie le SHA-256 epingle, installe dans vlc\.
        & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/fetch-libvlc.ps1 -Destination (Join-Path $bundle 'vlc')
        if ($LASTEXITCODE -ne 0) { throw "fetch-libvlc.ps1 a echoue (code $LASTEXITCODE)" }
        Copy-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/laststream-shell-ng.exe' -Destination (Join-Path $bundle 'laststream.exe') -Force
        foreach ($f in 'README-FR.txt', 'laststream.exe', 'laststream-runtime.exe', 'ffmpeg.exe', 'libmpv-2.dll', 'server.js', 'ui/index.html', 'lastaddon/lastaddon.cjs', 'lastaddon/node.exe', 'vlc/libvlc.dll', 'vlc/libvlccore.dll', 'vlc/COPYING-libvlc.txt') {
          if (-not (Test-Path -LiteralPath (Join-Path $bundle $f))) { throw "Bundle incomplet : $f absent de $bundle" }
        }
    - name: Build the installer (Inno Setup 6)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $candidates = @(
          Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
        )
        $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc) {
          # Inno Setup 6 est preinstalle sur l'image windows-latest ; ce repli ne sert que si l'image change.
          # Version epinglee : 6.7.1, derniere 6.x disponible sur Chocolatey.
          choco install innosetup --version 6.7.1 --no-progress -y
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        }
        if (-not $iscc) { throw 'ISCC.exe introuvable (Inno Setup 6)' }
        # Le .iss vise par defaut le dist\ du workspace local (..\..\dist) : en CI, le bundle et la sortie sont dans le depot.
        $root = (Get-Location).Path
        & $iscc "/DMyAppSourceDir=$root\dist\laststream-desktop" "/O$root\dist\installer" 'setup\Laststream.iss'
        if ($LASTEXITCODE -ne 0) { throw "ISCC a echoue (code $LASTEXITCODE)" }
    - name: Upload the installer
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: installer
        path: apps/desktop/dist/installer/Laststream-Setup-*.exe
        if-no-files-found: error
    - name: Upload the ARM64 binary (not published)
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: arm64-binary
        path: apps/desktop/target/aarch64-pc-windows-msvc/release/laststream-shell-ng.exe
        if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: disable git eol translation
      run: git config --global core.autocrlf false
      # Avant le checkout, apps/desktop n'existe pas encore : racine du workspace.
      working-directory: .
    - name: checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: ${{ format('refs/tags/{0}', inputs.tag) }}
        persist-credentials: false
    - name: Download the installer
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: installer
        path: apps/desktop/release
    - name: SHA-256, checksum file and latest.json
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $installers = @(Get-ChildItem release -Filter 'Laststream-Setup-*.exe')
        if ($installers.Count -ne 1) { throw "Un seul installeur attendu dans release\ : $($installers.Count) trouve(s)" }
        $installer = $installers[0].FullName
        $name = $installers[0].Name
        $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
        Set-Content -LiteralPath "$installer.sha256" -Value "$hash  $name" -Encoding ascii
        node scripts/windows-manifest.mjs build $installer --out release/latest.json
        if ($LASTEXITCODE -ne 0) { throw 'Generation de latest.json echouee' }
        "SHA-256 de ${name} : $hash" >> $env:GITHUB_STEP_SUMMARY
    # Le secret n'est expose qu'a cette etape ; sans lui, sign-update.mjs echoue et rien n'est publie.
    - name: Sign latest.json (ed25519)
      shell: pwsh
      env:
        LASTSTREAM_UPDATE_SIGNING_KEY: ${{ secrets.LASTSTREAM_UPDATE_SIGNING_KEY }}
      run: |
        $ErrorActionPreference = 'Stop'
        node scripts/sign-update.mjs release/latest.json
        if ($LASTEXITCODE -ne 0) { throw 'Signature de latest.json echouee (secret absent ou invalide)' }
        if (-not (Test-Path -LiteralPath release/latest.json.sig)) { throw 'latest.json.sig absent apres signature' }
    # Toujours expose : release.yml (publish=false) y prend l'installeur et le flux signe pour publier la release.
    - name: Expose the signed assets as an artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: desktop-release
        path: |
          apps/desktop/release/Laststream-Setup-*.exe
          apps/desktop/release/Laststream-Setup-*.exe.sha256
          apps/desktop/release/latest.json
          apps/desktop/release/latest.json.sig
        if-no-files-found: error
    - name: Upload the assets to the release
      # format() : inputs.publish est vide en workflow_dispatch (publication par defaut), 'false' seulement si l'appelant le demande.
      if: ${{ format('{0}', inputs.publish) != 'false' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = (Get-ChildItem release -Filter 'Laststream-Setup-*.exe')[0].FullName
        $assets = @($installer, "$installer.sha256", 'release/latest.json', 'release/latest.json.sig')
        gh release upload $env:RELEASE_TAG $assets --clobber
        if ($LASTEXITCODE -ne 0) { throw "gh release upload a echoue (code $LASTEXITCODE)" }
    - name: Publish the release (draft -> public)
      if: ${{ format('{0}', inputs.publish) != 'false' }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        gh release edit $env:RELEASE_TAG --draft=false
        if ($LASTEXITCODE -ne 0) { throw "gh release edit --draft=false a echoue (code $LASTEXITCODE)" }
