name: Core deploy

# Déploie le Worker lastaddon-core (services/core) avec l'interface (apps/web) du même commit.
# Déclenchement : push d'un tag core-vX.Y.Z (créé par `npm run release -- X.Y.Z` dans services/core), ou à la main.
# La garde de deploy:worker (LAST-150) s'applique telle quelle : HEAD doit porter un tag core-vX.Y.Z et être la pointe
# de origin/main ; sinon le déploiement est refusé avec la liste des raisons. Verrou KV contre deux déploiements simultanés.
#
# Secret du dépôt : CLOUDFLARE_API_TOKEN (modèle « Edit Cloudflare Workers » : Workers et KV en écriture).
# Ne pas relier aussi lastaddon-core à ce dépôt dans Cloudflare (Workers Builds) : un `wrangler deploy` nu publierait
# le Worker sans l'interface (worker-ui/ n'est rempli que par deploy:worker).
on:
  push:
    tags: ['core-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Identifiant du compte Cloudflare (non secret, visible dans les URL du tableau de bord).
      CLOUDFLARE_ACCOUNT_ID: 4f2452fbc81b70c2549d6f7dd779b190
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # Historique et tags complets : la garde compare HEAD à origin/main et lit les tags posés sur HEAD.
      # Jeton conservé : la garde relance git fetch et git ls-remote sur ce dépôt privé.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Typecheck, lint et tests sont passés dans Web CI : build seul.
      - name: Build de l'interface
        working-directory: apps/web
        run: |
          npm ci
          npm run build:ci

      - name: Dépendances du serveur
        working-directory: services/core
        run: npm ci

      - name: Déploiement de lastaddon-core
        working-directory: services/core
        run: npm run deploy:worker
