name: Tauri CI

# Coque Tauri (apps/tauri, macOS et Windows). Elle compile aussi les modules partagés de apps/desktop (#[path]) :
# un changement de ces fichiers est donc vérifié ici en plus de Desktop CI.

on:
  pull_request:
    paths: ['apps/tauri/**', 'apps/desktop/src/laststream_app/**', '.github/workflows/tauri-ci.yml']
  push:
    branches: [main]
    paths: ['apps/tauri/**', 'apps/desktop/src/laststream_app/**', '.github/workflows/tauri-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/tauri/src-tauri

jobs:
  # Tests (modules partagés compris), format et clippy, sous Linux.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: System libraries (WebKitGTK, mpv)
      working-directory: .
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libmpv-dev pkg-config
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/tauri/src-tauri
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      # new-without-default : avertissement du code partagé de la coque Windows (robust.rs), laissé tel quel.
      run: cargo clippy --locked -- -D warnings -A clippy::new-without-default
    - name: Tests
      run: cargo test --locked

  # macOS (Apple Silicon) : libmpv de Homebrew préparée pour Contents/Frameworks, .app + .dmg en artefact (non signé).
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: mpv (Homebrew)
      working-directory: .
      run: brew install mpv dylibbundler pkg-config
    - name: Stage libmpv for the app bundle
      working-directory: apps/tauri
      run: bash scripts/stage-mpv-macos.sh
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/tauri/src-tauri
    - name: Tests
      run: cargo test --locked
      env:
        LASTSTREAM_MPV_LIB_DIR: ${{ github.workspace }}/apps/tauri/src-tauri/target/mpv-stage
    - name: Build the app (.app, .dmg)
      working-directory: apps/tauri
      env:
        LASTSTREAM_MPV_LIB_DIR: ${{ github.workspace }}/apps/tauri/src-tauri/target/mpv-stage
      run: |
        npm ci
        npx tauri build --bundles app,dmg --config src-tauri/target/mpv-stage/frameworks.json
    - name: Check the bundle (libmpv from Contents/Frameworks)
      working-directory: apps/tauri/src-tauri/target/release/bundle
      run: |
        app="macos/Laststream.app"
        otool -L "$app/Contents/MacOS/laststream-tauri" | grep -E "libmpv"
        otool -L "$app/Contents/MacOS/laststream-tauri" | grep -q "@rpath/libmpv.2.dylib"
        test -f "$app/Contents/Frameworks/libmpv.2.dylib"
        # Aucune dépendance ne doit pointer vers Homebrew.
        ! otool -L "$app"/Contents/Frameworks/*.dylib | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)"
        ls -la dmg
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: laststream-macos-arm64
        path: apps/tauri/src-tauri/target/release/bundle/dmg/*.dmg
        retention-days: 14

  # Windows : libmpv-2.dll (Git LFS) installée à côté de l'exécutable, installeur NSIS en artefact (non signé).
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: disable git eol translation
      working-directory: .
      run: git config --global core.autocrlf false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: libmpv (Git LFS)
      working-directory: .
      shell: bash
      env:
        LFS_TOKEN: ${{ github.token }}
      run: |
        auth=$(printf 'x-access-token:%s' "$LFS_TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
          git lfs pull --include="apps/desktop/libmpv-2_x64.zip"
        mkdir -p apps/tauri/src-tauri/target/mpv-win
        unzip -o -j apps/desktop/libmpv-2_x64.zip "*libmpv-2.dll" -d apps/tauri/src-tauri/target/mpv-win
        test -s apps/tauri/src-tauri/target/mpv-win/libmpv-2.dll
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/tauri/src-tauri
    - name: Build the installer (NSIS)
      working-directory: apps/tauri
      shell: bash
      run: |
        npm ci
        npx tauri build --bundles nsis --config '{"bundle":{"resources":{"target/mpv-win/libmpv-2.dll":"libmpv-2.dll"}}}'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: laststream-windows-x64
        path: apps/tauri/src-tauri/target/release/bundle/nsis/*.exe
        retention-days: 14
