name: Tauri CI

# Coque Tauri (apps/tauri, macOS et Windows). Elle compile aussi les modules partagés de apps/desktop (#[path]) :
# un changement de ces fichiers est donc vérifié ici en plus de Desktop CI.

on:
  pull_request:
    paths: ['apps/tauri/**', 'apps/desktop/src/laststream_app/**', '.github/workflows/tauri-ci.yml']
  push:
    branches: [main]
    paths: ['apps/tauri/**', 'apps/desktop/src/laststream_app/**', '.github/workflows/tauri-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/tauri/src-tauri

jobs:
  # Tests (modules partagés compris), format et clippy, sous Linux.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: System libraries (WebKitGTK, mpv)
      working-directory: .
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libmpv-dev pkg-config
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/tauri/src-tauri
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      # new-without-default : avertissement du code partagé de la coque Windows (robust.rs), laissé tel quel.
      run: cargo clippy --locked -- -D warnings -A clippy::new-without-default
    - name: Tests
      run: cargo test --locked

  # Compilation macOS (Apple Silicon) : calque OpenGL Objective-C et libmpv de Homebrew.
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: mpv (Homebrew)
      working-directory: .
      run: brew install mpv pkg-config
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/tauri/src-tauri
    - name: Build
      run: cargo build --locked
    - name: Tests
      run: cargo test --locked

  # Compilation Windows : libmpv liée par apps/desktop/mpv-x64/mpv.lib (versionnée hors LFS).
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: disable git eol translation
      working-directory: .
      run: git config --global core.autocrlf false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/tauri/src-tauri
    - name: Build
      run: cargo build --locked
