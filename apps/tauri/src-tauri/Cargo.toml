[package]
name = "laststream-tauri"
version = "1.0.59"
edition = "2021"
description = "Laststream : coque Tauri (macOS et Windows)"
publish = false

[lib]
name = "laststream_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive", "unicode"] }
open = "5"
url = { version = "2", features = ["serde"] }
uuid = { version = "1.19", features = ["v4"] }
dirs = "6"
flume = "0.11"
once_cell = "1.19"
anyhow = "1"
base64 = "0.22"
urlencoding = "2"
bitflags = "2"
parse-display = "0.9"
semver = "1"
sha2 = "0.10"
ed25519-dalek = "2"
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
libmpv2 = "6.0.0"
libmpv2-sys = "4.0.1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "native-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["unknwnbase", "guiddef", "minwindef", "winerror", "dxgitype", "ntdef", "fileapi", "ntdef", "winbase", "winuser", "jobapi2", "handleapi", "libloaderapi", "d3d11", "d3dcommon", "dxgi", "dxgiformat", "dxgitype", "wingdi"] }
winreg = "0.52"

[dev-dependencies]
serde_test = "1.0"

[profile.release]
lto = true
codegen-units = 1
