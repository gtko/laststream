<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0b11;color:#f4f2f7;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
h1,h2,h3,h4,p,ul{margin:0;padding:0}ul{list-style:none}

.btn-p{background:#ff5a36;color:#0c0b11}.btn-g{background:rgba(255,255,255,.14)}

.opt.sel{border-color:#ff5a36;background:rgba(255,90,54,.08)}
.rad{width:20px;height:20px;border-radius:50%;border:2px solid #6b6680;flex:none;display:flex;align-items:center;justify-content:center}
.sel .rad{border-color:#ff5a36}.sel .rad i{width:10px;height:10px;border-radius:50%;background:#ff5a36;display:block}
.on{width:20px;height:20px;border-radius:5px;border:2px solid #6b6680;flex:none;display:flex;align-items:center;justify-content:center}
.sel .on{background:#ff5a36;border-color:#ff5a36;color:#0c0b11}
.h{font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;color:#a19dae;margin:16px 0 8px;letter-spacing:.02em}
.t{font-size:15px;font-weight:600}.s{font-size:12px;color:#a19dae;margin-top:2px}
