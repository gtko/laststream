<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laststream</title>
<meta name="description" content="Laststream : films, séries et TV en direct.">
<meta name="theme-color" content="#0c0b11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  // Désinscrit tout service worker laissé par l'ancienne app sur cette origine.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((reg) => reg.unregister())).catch(() => {});
  }
</script>
</head>
<body>
<div id="app" class="s-a" aria-busy="true"></div>
<div id="detail" hidden></div>

<div id="modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button type="button" class="modal-close" id="modal-close" aria-label="Fermer">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="player" class="player" role="dialog" aria-modal="true" aria-label="Lecteur TV en direct" hidden>
  <video id="player-video" playsinline autoplay></video>
  <div class="player-top">
    <button type="button" class="f-round" data-pclose data-tip="Fermer" aria-label="Fermer le lecteur">&times;</button>
    <div class="player-zap">
      <button type="button" class="f-round" data-pinfo data-tip="Infos (i)" aria-label="Afficher ou masquer les infos" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </div>
  </div>
  <div class="player-status" id="player-status" role="status" aria-live="polite" hidden></div>
  <div class="player-foot">
    <div class="player-banner" id="player-banner"></div>
    <div class="player-bar" id="player-bar">
      <div class="pbar-grp">
        <button type="button" class="lp-btn" data-pplay data-tip="Pause (Espace)" aria-label="Pause"></button>
        <button type="button" class="lp-btn" data-pprev data-tip="Chaîne précédente" aria-label="Chaîne précédente"></button>
        <button type="button" class="lp-btn" data-pnext data-tip="Chaîne suivante" aria-label="Chaîne suivante"></button>
        <span class="lp-vol"><button type="button" class="lp-btn" data-pmute data-tip="Couper le son (M)" aria-label="Couper le son"></button><input class="lp-vslider" type="range" min="0" max="100" step="5" value="100" data-pvol aria-label="Volume"></span>
        <span class="pbar-chan"><span class="pbar-name" id="player-chname"></span><span class="pbar-live" id="player-live" hidden>DIRECT</span></span>
      </div>
      <div class="pbar-grp pbar-grp-r">
        <button type="button" class="lp-btn" data-ptrack="audio" data-tip="Piste audio" aria-label="Piste audio" hidden></button>
        <button type="button" class="lp-btn" data-ptrack="sub" data-tip="Sous-titres" aria-label="Sous-titres" hidden></button>
        <button type="button" class="lp-btn" data-ptrack="quality" data-tip="Qualité" aria-label="Qualité" hidden></button>
        <button type="button" class="lp-btn" data-ppip data-tip="Image dans l’image" aria-label="Image dans l’image" hidden></button>
        <button type="button" class="lp-btn" data-pfull data-tip="Plein écran (F)" aria-label="Plein écran" hidden></button>
        <button type="button" class="lp-btn" data-plist data-tip="Chaînes" aria-label="Liste des chaînes"></button>
      </div>
    </div>
  </div>
  <aside class="player-info" id="player-info" aria-label="Infos sur la chaîne" hidden></aside>
  <aside class="player-panel" id="player-panel" aria-label="Choix" hidden></aside>
  <div class="player-error" id="player-error" role="alert" hidden>
    <p>Chaîne indisponible</p>
    <small class="player-reason"></small>
    <div><button type="button" class="btn btn-primary" data-pnext>Chaîne suivante</button><button type="button" class="btn btn-ghost" data-pclose>Fermer</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
