<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laststream</title>
<meta name="description" content="Laststream : films, séries et TV en direct.">
<meta name="theme-color" content="#0c0b11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  // Désinscrit tout service worker laissé par l'ancienne app sur cette origine.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((reg) => reg.unregister())).catch(() => {});
  }
</script>
</head>
<body>
<div id="app" class="s-a" aria-busy="true"></div>
<div id="detail" hidden></div>

<div id="modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button type="button" class="modal-close" id="modal-close" aria-label="Fermer">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="player" class="player" role="dialog" aria-modal="true" aria-label="Lecteur TV en direct" hidden>
  <video id="player-video" playsinline autoplay></video>
  <div class="player-top">
    <button type="button" class="f-round" data-pclose data-tip="Fermer" aria-label="Fermer le lecteur">&times;</button>
    <div class="player-zap">
      <button type="button" class="f-round" data-pprev data-tip="Chaîne précédente" aria-label="Chaîne précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <button type="button" class="f-round" data-pnext data-tip="Chaîne suivante" aria-label="Chaîne suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button type="button" class="f-round" data-pinfo data-tip="Infos (i)" aria-label="Afficher ou masquer les infos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </div>
  </div>
  <div class="player-banner" id="player-banner" aria-live="polite"></div>
  <div class="player-error" id="player-error" role="alert" hidden>
    <p>Cette chaîne ne répond pas</p>
    <div><button type="button" class="btn btn-primary" data-pnext>Chaîne suivante</button><button type="button" class="btn btn-ghost" data-pclose>Fermer</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
