<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Laststream est hors ligne</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c0b11; color: #f4f2f7; font: 500 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px 24px; text-align: center; }
  .mark { width: 72px; height: 72px; border-radius: 22px; background: #ff5a36; display: grid; place-items: center; font-size: 34px; font-weight: 800; color: #0c0b11; }
  h1 { margin: 6px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  p { margin: 0; max-width: 28em; color: #a19dae; }
  button { margin-top: 10px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #ff5a36; color: #0c0b11; font: inherit; font-weight: 800; cursor: pointer; }
  button:focus-visible { outline: 3px solid #f4f2f7; outline-offset: 3px; }
  button[disabled] { opacity: 0.6; }
  .status { min-height: 1.5em; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">L</div>
  <h1>Laststream est hors ligne</h1>
  <p>Impossible de joindre le serveur Laststream. Vérifie ta connexion à Internet, puis réessaie.</p>
  <button id="retry" type="button">Réessayer</button>
  <p class="status" id="status" role="status"></p>
</main>
<script>
  // Adresse du serveur Laststream : la même que capacitor.config.json (server.url) et PUBLIC_BASE (src/data/config.ts).
  var SERVER = 'https://app.laststream.app/';
  var btn = document.getElementById('retry');
  var status = document.getElementById('status');
  function retry() {
    btn.disabled = true;
    status.textContent = 'Connexion…';
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 6000);
    // Sonde d'abord : si le serveur ne répond toujours pas, on reste ici au lieu de rebasculer sur la page d'erreur.
    fetch(SERVER + 'health', { mode: 'no-cors', cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function () { location.replace(SERVER); })
      .catch(function () { status.textContent = 'Toujours hors ligne.'; btn.disabled = false; })
      .then(function () { clearTimeout(timer); });
  }
  btn.addEventListener('click', retry);
  window.addEventListener('online', retry);
</script>
</body>
</html>
